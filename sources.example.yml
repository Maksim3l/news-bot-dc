    url: https://hnrss.org/frontpage
    color: "#ff6600"
    interval: 900

  - name: Lobsters
    url: https://lobste.rs/rss
    interval: 900

  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index

  - name: The Verge
    url: https://www.theverge.com/rss/index.xml

  - name: Phoronix
    url: https://www.phoronix.com/rss.php

  - name: Hackaday
    url: https://hackaday.com/blog/feed/

  - name: GitHub Blog
    url: https://github.blog/feed/
    interval: 3600

  # --- Slovenian business, digest only --------------------------------------
  - name: Forbes Slovenija
    url: https://forbes.n1info.si/feed/
    language: sl
    post: false

  # GZS publishes no feed, so it is read through a Google News site search.
  - name: GZS
    url: https://news.google.com/rss/search?q=site:gzs.si&hl=sl&gl=SI&ceid=SI:sl
    language: sl
    post: false
    interval: 3600

  # Anything mentioning Dewesoft, in either language. digest.yml gives these
  # priority for the tech slot.
  - name: Dewesoft news (sl)
    url: https://news.google.com/rss/search?q=Dewesoft&hl=sl&gl=SI&ceid=SI:sl
    language: sl
    post: false
    interval: 3600

  - name: Dewesoft news (en)
    url: https://news.google.com/rss/search?q=Dewesoft&hl=en-US&gl=US&ceid=US:en
    post: false
    interval: 3600

  # --- Finance, digest only ------------------------------------------------
