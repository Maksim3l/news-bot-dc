    url: https://www.technologyreview.com/feed/
    post: false

  - name: ScienceDaily Technology
    url: https://www.sciencedaily.com/rss/top/technology.xml
    post: false

  - name: Euractiv
    url: https://www.euractiv.com/feed/
    post: false

  - name: European Parliament press
    url: https://www.europarl.europa.eu/rss/doc/press-releases/en.xml
    post: false
    interval: 3600

  # --- Good news and climate, digest only -----------------------------------
  - name: Positive News
    url: https://www.positive.news/feed/
    post: false
    interval: 3600

  - name: Good News Network
    url: https://www.goodnewsnetwork.org/feed/
    post: false
    interval: 3600

  - name: Reasons to be Cheerful
    url: https://reasonstobecheerful.world/feed/
    post: false
    interval: 3600

  - name: Carbon Brief
    url: https://www.carbonbrief.org/feed/
    post: false
    interval: 3600

  - name: Mongabay
    url: https://news.mongabay.com/feed/
    post: false
    interval: 3600

  # --- Filtering example ---------------------------------------------------
  # Only posts matching "include" get through; anything matching "exclude" is
  # dropped first. Both are regexes, matched against title + summary.
  #
  # - name: Slo-Tech Novice
  #   url: https://slo-tech.com/rss
  #   filters:
  #     include:
  #       - "linux|nvidia|amd"
  #     exclude:
  #       - "oglasno sporocilo"

  # --- Sites without a feed ------------------------------------------------
  # "item" selects each card on the page, the rest are read inside it.
  # "sel@attr" reads an attribute, plain "sel" reads text, "@attr" reads the
  # item element itself. Relative links are resolved against "url".
  #
  # - name: Example Blog
  #   url: https://example.com/news
  #   type: html
  #   selectors:
  #     item: "article.post"
  #     title: "h2 a"
  #     link: "h2 a@href"
  #     summary: "p.excerpt"
  #     image: "img@src"
  #     published: "time@datetime"

  # --- JSON endpoints ------------------------------------------------------
  # Selectors are dotted paths; "item" points at the list.
  #
  # - name: Example API
  #   url: https://example.com/api/posts
  #   type: json
  #   selectors:
  #     item: "data.posts"
  #     title: "headline"
  #     link: "permalink"
  #     summary: "excerpt"
  #     published: "published_at"
