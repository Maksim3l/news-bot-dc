# ---------------------------------------------------------------------------
# Daily digest. Template: copy it to digest.yml (`make setup` does this) and
# edit the copy. Delete digest.yml or set enabled: false to turn the digest off.
#
# Every source in sources.yml feeds a pool all day; that part uses no model.
# At build_at the model reads the pool and picks at most one article per
# category, or none if nothing is good enough. Non-English picks get an English
# article on the same story linked under them, then a line from The Office.
# The finished digest is stored and posted at post_at.
# Apply edits with /reload in Discord, or restart.
# ---------------------------------------------------------------------------

enabled: true

# Channel ID, or a name from the "channels" block in sources.yml.
# Empty means DISCORD_CHANNEL_ID from .env.
channel:

# The model only runs between build_at and build_deadline. A build still
# running at the deadline is stopped and that day has no digest, so the machine
# is never busy during working hours. Missed windows are skipped, not caught up.
build_at: "05:00"
build_deadline: "06:30"
post_at: "08:00"
timezone: Europe/Ljubljana

# ollama: a local model, free, runs on this machine (or the compose container).
# anthropic: Claude API, needs ANTHROPIC_API_KEY in .env.
provider: ollama

# Ollama tag. A mixture-of-experts model with 3B active parameters, so it runs
# at usable speed on a CPU with no GPU; needs about 20 GB of RAM while it runs.
# Check the exact tag at https://ollama.com/library/qwen3.6 before the first run.
# For provider: anthropic use a Claude model ID such as claude-haiku-5-5.
model: qwen3.6:35b-a3b

ollama:
  # Overridden by OLLAMA_URL in .env and by docker compose.
  url: http://localhost:11434
  # Context window in tokens. Must hold the whole article list; Ollama's own
  # default is small and cuts the prompt without an error.
  num_ctx: 16384
  # CPU threads. Empty uses Ollama's default (all performance cores).
  num_thread:
  # Reasoning before answering. Off is several times faster; ranking does not need it.
  think: false
  # Downloads the model on first start if Ollama does not have it.
  pull_missing: true

# Anthropic only. low | medium | high | xhigh | max.
effort: medium

# Hours of collected items the digest reads.
window_hours: 24
# Items published longer ago than this never enter the pool.
max_age_hours: 48
# Most articles shown to the model. Newest are kept; preferred ones always are.
# Prompt size, and so build time on CPU, grows with this and summary_chars.
max_candidates: 150
# Characters of each article's summary shown next to its title. 0 = titles only.
summary_chars: 100
# Unpicked items are forgotten after this many days.
keep_days: 14
# true posts a short "nothing today" message when every category came back empty.
post_when_empty: false

quality_bar: >
  Would a curious engineer in Slovenia be glad they read it? Real news with
  something concrete in it. A slow day with no pick is better than a weak pick.

# One slot per category, posted in this order.
#   key          short id, lowercase
#   title        heading shown in Discord
#   brief        what belongs here, written for the model
#   prefer       regexes; a matching article always wins this slot
#   prefer_note  told to the model next to the brief
categories:
  - key: tech
    title: Tech and research
    brief: >
      A notable technology improvement, an interesting piece of tech, a
      research result, or a new EU rule or regulation affecting technology
      or business. Slovenian industry news counts.
    prefer:
      - "dewe ?soft"
    prefer_note: Anything new about Dewesoft (Slovenian test and measurement company) takes this slot.

  - key: good_news
    title: Good news
    brief: >
      Good news: climate, green tech, conservation and nature preservation,
      or a hopeful statistic showing something measurably getting better.
      Must be positive on its own terms, not a bad story with a silver lining.

quote:
  enabled: true
  # Lines from the full US transcript, 6 to 45 words each.
  dataset: assets/office_quotes.csv
  # Lines shown to the model to choose from.
  shortlist: 40

english:
  enabled: true
  # Where English coverage is searched. {query} is filled in by the bot.
  search_url: https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en
  results: 8
