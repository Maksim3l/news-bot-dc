[project]
name = "news-bot-dc"
version = "1.0.0"
description = "Discord bot that watches websites and posts new items to channels"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3,<3",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["newsbot*"]
